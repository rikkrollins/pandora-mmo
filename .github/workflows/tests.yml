name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Real fix (2026-10-08, Coffee: "I keep getting emails about a failed
# GitHub" -- a high-commit-rate day, each push queuing its own ~20min
# full-suite run): a new push to the same branch now cancels whatever
# run is still in flight for it, instead of letting a now-superseded
# run finish and send its own separate email too. The LATEST commit's
# own run is never cancelled by this -- cancel-in-progress only ever
# cancels an OLDER run when a newer one for the same group starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run FastRegressionTests
        # Real, deterministic unit tests -- no live Ollama/Telegram
        # network calls, no real secrets needed (every config value
        # here falls back to a safe default via os.getenv). DB_PATH
        # points at a throwaway file, same convention every test run
        # in this project already uses -- never the real database.
        run: DB_PATH=tests/tmp/ci_regression.db python3 -m unittest tests.test_regression.FastRegressionTests -v
